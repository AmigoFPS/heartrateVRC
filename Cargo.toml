[workspace]
resolver = "2"
members = ["heartrate/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["nullshii", "Amigo_FPS"]
license = "MIT"

[workspace.dependencies]
heartrate_core = { path = "heartrate/core" }
heartrate_cli = { path = "heartrate/cli" }
heartrate_gui = { path = "heartrate/gui" }
heartrate_tui = { path = "heartrate/tui" }


btleplug = "0.12.0"
tokio = { version = "1.52.3", features = ["full"] }
uuid = "1.0"
futures = "0.3"
rosc = "0.11.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.34.2"
egui_plot = "0.35.0"
ratatui = { version = "0.30.1", features = ["serde"] }
crossterm = "0.29.0"
color-eyre = "0.6.5"
log = { version = "0.4.32", features = ["serde"] }

[profile.distribution]
inherits = "release"
lto = true

[profile.release]
debug = false
strip = "symbols"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
