[workspace]
resolver = "2"
members = ["heartrate/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["nullshii", "Amigo_FPS"]
license = "MIT"

[workspace.dependencies]
heartrate_core = { path = "heartrate/core" }
heartrate_cli = { path = "heartrate/cli" }
heartrate_gui = { path = "heartrate/gui" }

btleplug = "0.12.0"
tokio = { version = "1.52.3", features = ["full"] }
uuid = "1.0"
futures = "0.3"
rosc = "0.11.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
eframe = "0.34.2"
egui_plot = "0.35.0"

[profile.release]
debug = false
strip = "symbols"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"